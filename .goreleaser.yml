version: 2

before:
  hooks:
    - go mod download
    - go mod tidy
builds:
  -
    ldflags:
      - -s -w
        -X "github.com/sonatype-nexus-community/nancy/buildversion.BuildVersion={{.Version}}"
        -X "github.com/sonatype-nexus-community/nancy/buildversion.BuildTime={{time "2006-01-02T15:04:05Z07:00"}}"
        -X "github.com/sonatype-nexus-community/nancy/buildversion.BuildCommit={{.FullCommit}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 'amd64'
      - '386'
      - 'arm64'
    ignore:
      # fix for build error:
      # ⨯ release failed after 124.25s error=failed to build for windows_arm64: exit status 2: # golang.org/x/sys/windows
      #/go/pkg/mod/golang.org/x/sys@v0.0.0-20200519105757-fe76b779f299/windows/zsyscall_windows.go:2833:38: undefined: WSAData
      #/go/pkg/mod/golang.org/x/sys@v0.0.0-20200519105757-fe76b779f299/windows/zsyscall_windows.go:3106:51: undefined: Servent
      #/go/pkg/mod/golang.org/x/sys@v0.0.0-20200519105757-fe76b779f299/windows/zsyscall_windows.go:3120:50: undefined: Servent
      - goos: windows
        goarch: 'arm64'

archives:
  -
    id: default
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [ binary ]
  -
    id: homebrew
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [ zip ]

checksum:
  name_template: "{{ .ProjectName }}checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-next-{{.FullCommit}}"

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'

release:
  prerelease: auto
  ids:
    - default
    - homebrew
  github:
    owner: sonatype-nexus-community
    name: nancy

brews:
  -
    skip_upload: auto
    ids:
      - homebrew
    repository:
      owner: sonatype-nexus-community
      name: homebrew-nancy-tap

    homepage: https://github.com/sonatype-nexus-community/nancy
    description: "A tool to check for vulnerabilities in your Golang dependencies, powered by Sonatype Guide"

dockers:
  -
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    ids:
      - nancy
    build_flag_templates:
    - "--label=author='Sonatype Community <community@sonatype.com>'"
    - "--label=version={{ .Version }}"
    - "--label=maintainer='Sonatype Community <community@sonatype.com>'"
    image_templates:
    - "sonatypecommunity/nancy:{{ .Tag }}"
    - '{{ if not .Prerelease }}sonatypecommunity/nancy:latest{{ end }}'
    - '{{ if not .Prerelease }}sonatypecommunity/nancy:v{{ .Major }}{{ end }}'
    - '{{ if not .Prerelease }}sonatypecommunity/nancy:v{{ .Major }}.{{ .Minor }}{{ end }}'
  -
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.alpine
    ids:
      - nancy
    build_flag_templates:
    - "--pull"
    - "--label=author='Sonatype Community <community@sonatype.com>'"
    - "--label=version={{ .Version }}"
    - "--label=maintainer='Sonatype Community <community@sonatype.com>'"
    image_templates:
    - "sonatypecommunity/nancy:{{ .Tag }}-alpine"
    - '{{ if not .Prerelease }}sonatypecommunity/nancy:alpine{{ end }}'
    - '{{ if not .Prerelease }}sonatypecommunity/nancy:v{{ .Major }}-alpine{{ end }}'
    - '{{ if not .Prerelease }}sonatypecommunity/nancy:v{{ .Major }}.{{ .Minor }}-alpine{{ end }}'

nfpms:
  -
    vendor: sonatype-nexus-community
    maintainer: Sonatype Community <community@sonatype.com>
    homepage: https://github.com/sonatype-nexus-community/nancy
    description: "A tool to check for vulnerabilities in your Golang dependencies, powered by Sonatype Guide"
    formats:
      - apk
      - deb
      - rpm
